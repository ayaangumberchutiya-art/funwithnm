<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NM Lab Code Helper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --green: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 20px;
      min-height: 100vh;
      user-select: none;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      text-align: center;
    }
    h1 {
      color: var(--accent);
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.desc {
      color: #94a3b8;
      font-size: 14px;
    }

    /* Giant Fullscreen Touch/Click Area */
    .action-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #060913;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      text-align: center;
      padding: 24px;
      cursor: pointer;
    }
    .status-badge {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge.success {
      color: var(--green);
    }
    .status-sub {
      color: #94a3b8;
      font-size: 15px;
      max-width: 320px;
      line-height: 1.4;
    }
    .pulse-tap {
      margin-top: 25px;
      padding: 14px 28px;
      background: #1e293b;
      border: 1px solid var(--accent);
      border-radius: 30px;
      font-weight: 600;
      color: #fff;
      font-size: 16px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.98); opacity: 0.8; }
    }
    .hidden { display: none !important; }

    /* Home Dashboard styles */
    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .card-route {
      font-family: monospace;
      color: #cbd5e1;
      font-size: 13px;
      background: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .card-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
    }
    .card-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- Hidden native input for mobile clipboard execCommand -->
  <textarea id="native-copy" readonly style="position:fixed;top:-1000px;left:-1000px;opacity:0.001;"></textarea>

  <!-- Fullscreen Touch Target -->
  <div id="overlay" class="action-overlay hidden">
    <div class="status-badge" id="badge-title">
      <span id="copied-slug">Code</span>
    </div>
    <p class="status-sub" id="status-msg">Tap anywhere to copy & close!</p>
    <div class="pulse-tap" id="tap-btn">👆 TAP ANYWHERE</div>
  </div>

  <div class="container" id="main-content">
    <header>
      <h1>Numerical Methods C++ Code Auto-Copy</h1>
      <p class="desc">Enter <code>/&lt;keyword&gt;</code> in browser URL to auto-copy C++ code & auto-close!</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Search method or keyword (e.g. simpsons-13, trapezoidal)...">

    <div class="grid" id="grid"></div>
  </div>

  <script src="/codes.js"></script>
  <script>
    function triggerVibrate() {
      if (navigator.vibrate) {
        navigator.vibrate(60);
      }
    }

    // High compatibility copy function for iOS & Android
    async function doCopy(text) {
      let copied = false;

      // 1. Try modern clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (e) {}
      }

      // 2. Fallback to execCommand (works 100% on mobile user gesture)
      if (!copied) {
        try {
          const ta = document.getElementById("native-copy");
          ta.value = text;
          ta.removeAttribute('readonly');
          ta.select();
          ta.setSelectionRange(0, 999999);
          copied = document.execCommand('copy');
          ta.setAttribute('readonly', true);
        } catch (err) {}
      }

      return copied;
    }

    function exitNow() {
      try {
        window.open('', '_self', '');
        window.close();
      } catch (e) {}
      window.location.replace("about:blank");
    }

    function getSlug() {
      let path = window.location.pathname.replace(/^\/+/g, '').replace(/\/+$/g, '').toLowerCase();
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('q')) {
        path = urlParams.get('q').toLowerCase();
      }
      return path;
    }

    const slug = getSlug();
    const overlay = document.getElementById("overlay");
    const mainContent = document.getElementById("main-content");
    const copiedSlugEl = document.getElementById("copied-slug");
    const badgeTitle = document.getElementById("badge-title");
    const statusMsg = document.getElementById("status-msg");
    const tapBtn = document.getElementById("tap-btn");

    if (slug && CODES[slug]) {
      mainContent.classList.add("hidden");
      overlay.classList.remove("hidden");
      copiedSlugEl.innerText = "/" + slug;

      const code = CODES[slug];

      // Step A: Background silent copy attempt (Works instantly on PC/Chrome)
      doCopy(code).then((ok) => {
        if (ok) {
          triggerVibrate();
          badgeTitle.classList.add("success");
          badgeTitle.innerHTML = "✅ Copied!";
          statusMsg.innerText = "Closing...";
          tapBtn.style.display = "none";
          setTimeout(exitNow, 700);
        }
      });

      // Step B: Mobile User Gesture (1-Tap anywhere on screen)
      let handled = false;
      function handleUserTap() {
        if (handled) return;
        handled = true;
        doCopy(code).then(() => {
          triggerVibrate();
          badgeTitle.classList.add("success");
          badgeTitle.innerHTML = "✅ Copied!";
          statusMsg.innerText = "Closing...";
          tapBtn.style.display = "none";
          setTimeout(exitNow, 500);
        });
      }

      overlay.addEventListener('touchstart', handleUserTap, { passive: true });
      overlay.addEventListener('click', handleUserTap);

    } else {
      // Home Page
      const grid = document.getElementById("grid");
      const searchInput = document.getElementById("searchInput");

      function render(filter = "") {
        grid.innerHTML = "";
        const keys = Object.keys(CODES);
        const filtered = keys.filter(k => k.toLowerCase().includes(filter.toLowerCase()));

        if (filtered.length === 0) {
          grid.innerHTML = "<p style='color:#94a3b8;'>No matching keywords found.</p>";
          return;
        }

        filtered.forEach(key => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div>
              <div class="card-title">${key.replace(/-/g, ' ').toUpperCase()}</div>
              <div class="card-route">/${key}</div>
            </div>
            <button class="card-btn">Copy & Test</button>
          `;
          card.onclick = () => {
            window.location.href = "/" + key;
          };
          grid.appendChild(card);
        });
      }

      render();
      searchInput.addEventListener("input", (e) => render(e.target.value));
    }
  </script>
</body>
</html>
