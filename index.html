<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NM Lab Code Helper</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --green: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .action-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      text-align: center;
    }
    .copy-btn {
      width: 90%;
      max-width: 320px;
      padding: 20px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .copy-btn.copied {
      background: var(--green);
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.5);
    }
    .sub-text {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 14px;
    }
    /* Hidden code holder but visible to mobile DOM selection */
    #mobile-clipboard {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: none;
      background: transparent;
      color: transparent;
    }
    .hidden { display: none !important; }

    /* Home Dashboard */
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 24px; text-align: center; }
    h1 { color: var(--accent); font-size: 24px; margin-bottom: 8px; }
    p.desc { color: #94a3b8; font-size: 14px; }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    .card-route {
      font-family: monospace; color: #cbd5e1; font-size: 13px;
      background: #0f172a; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px;
    }
    .card-btn {
      background: #334155; color: #fff; border: none; border-radius: 4px; padding: 8px 12px; font-size: 12px; font-weight: 500;
    }
  </style>
</head>
<body>

  <textarea id="mobile-clipboard"></textarea>

  <!-- Overlay with explicit button for mobile touch event -->
  <div id="overlay" class="action-overlay hidden">
    <button id="copy-btn" class="copy-btn">
      <span>📋 TAP TO COPY</span>
    </button>
    <p class="sub-text" id="status-desc">Tap once to copy & close</p>
  </div>

  <div class="container" id="main-content">
    <header>
      <h1>Numerical Methods C++ Code Auto-Copy</h1>
      <p class="desc">Enter <code>/&lt;keyword&gt;</code> in browser URL to auto-copy C++ code & auto-close!</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="Search method or keyword (e.g. simpsons-13, trapezoidal)...">

    <div class="grid" id="grid"></div>
  </div>

  <script src="/codes.js"></script>
  <script>
    function getSlug() {
      let path = window.location.pathname.replace(/^\/+/g, '').replace(/\/+$/g, '').toLowerCase();
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('q')) {
        path = urlParams.get('q').toLowerCase();
      }
      return path;
    }

    const slug = getSlug();
    const overlay = document.getElementById("overlay");
    const mainContent = document.getElementById("main-content");
    const copyBtn = document.getElementById("copy-btn");
    const statusDesc = document.getElementById("status-desc");
    const ta = document.getElementById("mobile-clipboard");

    async function copyCode(text) {
      let ok = false;
      
      // 1. Modern API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e) {}
      }

      // 2. Fallback for iOS/Android WebView & Safari
      if (!ok) {
        try {
          ta.value = text;
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          ok = document.execCommand('copy');
        } catch (err) {}
      }

      return ok;
    }

    function doExit() {
      try {
        window.open('', '_self', '');
        window.close();
      } catch (e) {}
      window.location.replace("about:blank");
    }

    if (slug && CODES[slug]) {
      mainContent.classList.add("hidden");
      overlay.classList.remove("hidden");
      const code = CODES[slug];

      // Auto attempt for PC
      copyCode(code).then((success) => {
        if (success) {
          copyBtn.classList.add("copied");
          copyBtn.innerHTML = "✅ COPIED!";
          statusDesc.innerText = "Closing window...";
          setTimeout(doExit, 600);
        }
      });

      // Mobile Touch/Click Action
      async function handleTap(e) {
        e.preventDefault();
        const success = await copyCode(code);
        if (navigator.vibrate) navigator.vibrate(60);

        copyBtn.classList.add("copied");
        copyBtn.innerHTML = "✅ COPIED!";
        statusDesc.innerText = "Copied! Exiting...";

        setTimeout(doExit, 500);
      }

      copyBtn.addEventListener('click', handleTap);
      copyBtn.addEventListener('touchend', handleTap);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) handleTap(e);
      });

    } else {
      // Home page
      const grid = document.getElementById("grid");
      const searchInput = document.getElementById("searchInput");

      function render(filter = "") {
        grid.innerHTML = "";
        const keys = Object.keys(CODES);
        const filtered = keys.filter(k => k.toLowerCase().includes(filter.toLowerCase()));

        if (filtered.length === 0) {
          grid.innerHTML = "<p style='color:#94a3b8;'>No matching keywords found.</p>";
          return;
        }

        filtered.forEach(key => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div>
              <div class="card-title">${key.replace(/-/g, ' ').toUpperCase()}</div>
              <div class="card-route">/${key}</div>
            </div>
            <button class="card-btn">Copy & Test</button>
          `;
          card.onclick = () => {
            window.location.href = "/" + key;
          };
          grid.appendChild(card);
        });
      }

      render();
      searchInput.addEventListener("input", (e) => render(e.target.value));
    }
  </script>
</body>
</html>
